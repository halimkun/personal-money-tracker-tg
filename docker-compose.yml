# Stack lokal untuk development / E2E test:
#   docker compose up -d
# Lalu set DATABASE_URL & REDIS_URL di .env sesuai service di bawah.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moneybot
      POSTGRES_PASSWORD: moneybot
      POSTGRES_DB: moneybot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
