[project]
name = "personal-money-tracker-tg"
version = "0.1.0"
description = "Bot Telegram pencatatan keuangan pribadi multi-user: quick-add AI, wallet, budget, insight bulanan"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "aiohttp>=3.9",
    "apscheduler>=3.10,<4",
    "asyncpg>=0.29",
    "cryptography>=42",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
# Aplikasi (bukan package) — uv sync hanya install dependencies,
# tidak install project itu sendiri. Penting untuk build Docker.
package = false
